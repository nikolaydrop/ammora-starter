<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OctoSwap</title>
<link rel="icon" href="octopus.jpg">
<style>
  /* ===== COLORS: edit here only ===== */
  :root{--bg-top:#ffc8e3;--bg-bottom:#c4e3ff;--card:#fff;--field:#eeeaf4;--text:#3a2a5e;--muted:#8a7fa3;--accent:#1fc7d4;--accent-dark:#17a3ae;--purple:#7645d9;--err:#e11d48;--ok:#0f9d6b;--shadow:0 12px 40px rgba(118,69,217,.18)}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;color:var(--text);font-family:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;background:linear-gradient(180deg,var(--bg-top),var(--bg-bottom)) fixed}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 20px;background:rgba(255,255,255,.65);backdrop-filter:blur(10px)}
  .brand{display:flex;align-items:center;gap:10px}
  .brand img.logo{width:44px;height:44px;border-radius:50%;object-fit:cover;object-position:50% 62%}
  .brand b{font-size:20px;display:block;line-height:1.1}
  .brand small{color:var(--muted);font-size:12px;display:flex;align-items:center;gap:5px}.brand small img{height:12px}
  nav{display:flex;gap:22px;font-weight:600}nav a{color:var(--purple);text-decoration:none}
  button{font:inherit;cursor:pointer;border:0}
  .wallet{background:var(--purple);color:#fff;padding:10px 18px;border-radius:16px;font-weight:600}
  main{max-width:440px;margin:70px auto 30px;padding:0 16px}
  .card{position:relative;background:var(--card);border-radius:32px;padding:22px;box-shadow:var(--shadow)}
  .mascot{position:absolute;top:-62px;right:22px;width:95px;height:95px;border-radius:50%;object-fit:cover;object-position:50% 62%;border:4px solid var(--card);box-shadow:var(--shadow);animation:bob 3s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px) rotate(3deg)}}
  h1{margin:0 0 2px;font-size:22px}h2{margin:0 0 12px;font-size:18px}
  .sub{margin:0 0 16px;color:var(--muted);font-size:14px}
  .box{background:var(--field);border-radius:20px;padding:14px;margin-bottom:6px}
  .box label{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase}
  .row{display:flex;gap:10px;align-items:center;margin-top:8px}
  .row input{flex:1;min-width:0;background:none;border:0;outline:0;font:600 24px inherit;font-family:inherit;color:var(--text)}
  select{background:#fff;border:0;border-radius:14px;padding:10px 12px;font:600 15px inherit;font-family:inherit;color:var(--text)}
  .custom{display:none;margin-top:10px}.custom.show{display:block}
  .custom input{width:100%;border:2px solid transparent;background:#fff;border-radius:14px;padding:10px 12px;font:14px monospace;color:var(--text);outline:0}
  .custom input:focus{border-color:var(--accent)}
  .tokeninfo{margin-top:6px;font-size:13px;font-weight:600;color:var(--purple);min-height:18px}
  .flip{display:block;margin:-4px auto;width:38px;height:38px;border-radius:50%;background:var(--accent);color:#fff;font-size:18px;position:relative;z-index:1}
  .slip{display:flex;justify-content:space-between;align-items:center;padding:6px 6px 0;color:var(--muted);font-size:13px}
  .slip input{width:70px;border:0;border-radius:10px;padding:6px 8px;background:var(--field);color:var(--text);font:600 14px inherit;font-family:inherit;text-align:right;outline:0}
  .btns{display:grid;gap:10px;margin-top:14px}
  .swap{width:100%;padding:16px;border-radius:20px;font-size:17px;font-weight:700;color:#fff;background:linear-gradient(90deg,var(--accent),#5ee0c7);box-shadow:0 4px 0 var(--accent-dark);transition:transform .15s,box-shadow .15s}
  .swap:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 0 var(--accent-dark),0 0 22px rgba(31,199,212,.55)}
  .swap:disabled{opacity:.55;cursor:default}
  .ghost{width:100%;padding:13px;border-radius:20px;font-weight:700;color:var(--purple);background:var(--field)}
  .status{text-align:center;font-size:13px;color:var(--muted);margin-top:10px;min-height:18px;white-space:pre-wrap;word-break:break-word}
  .status.ok{color:var(--ok)}.status.er{color:var(--err)}.status a{color:var(--purple)}
  .launches{background:var(--card);border-radius:28px;padding:20px;margin-top:22px;box-shadow:var(--shadow)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;font-size:14px;color:var(--muted)}
  .item{display:grid;grid-template-columns:40px 1fr;gap:2px 10px;align-items:center;border-radius:16px;padding:10px;cursor:pointer;background:var(--field);word-break:break-all;color:var(--text)}
  .item:hover{outline:2px solid var(--accent)}.av{grid-row:span 3;width:40px;height:40px;border-radius:50%}
  .chip{justify-self:start;font-size:11px;font-weight:700;border-radius:99px;padding:1px 9px;color:#fff;background:#64748b}
  .chip.ACTIVE{background:#059669}.chip.PENDING{background:#f59e0b}.chip.MIGRATED{background:var(--purple)}.chip.FLAGGED{background:var(--err)}
  .item a{color:var(--purple);font-size:12px}.mut{color:var(--muted);font-size:12px}
  .partner{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:22px;color:var(--muted);font-size:14px}.partner img{height:22px}
  @media (max-width:600px){nav{display:none}}
</style>
</head>
<body>
<header>
  <div class="brand"><img class="logo" src="octopus.jpg" alt="OctoSwap">
    <div><b>OctoSwap</b><small>powered by <img src="ammora.jpg" alt="Ammora"></small></div></div>
  <nav><a href="#swapcard">Swap</a><a href="#launches-sec">Launches</a></nav>
  <button class="wallet" id="connect">Connect wallet</button>
</header>
<main>
  <div class="card" id="swapcard">
    <img class="mascot" src="octopus.jpg" alt="Octopus mascot">
    <h1>Swap</h1><p class="sub">GIWA Sepolia testnet. Test tokens only.</p>
    <div class="box"><label>You pay</label>
      <div class="row"><input id="amt" inputmode="decimal" placeholder="0.0" value="0.01"><select id="tokenFrom"></select></div>
      <div class="custom" id="customFrom"><input id="addrFrom" placeholder="Token contract address 0x..."><div class="tokeninfo" id="infoFrom"></div></div></div>
    <button class="flip" id="flip" title="Switch tokens">⇅</button>
    <div class="box"><label>You receive</label>
      <div class="row"><input id="amountTo" placeholder="0.0" readonly><select id="tokenTo"></select></div>
      <div class="custom" id="customTo"><input id="addrTo" placeholder="Token contract address 0x..."><div class="tokeninfo" id="infoTo"></div></div></div>
    <div class="slip"><span>Slippage, %</span><input id="slip" inputmode="decimal" value="1"></div>
    <div class="btns"><button class="ghost" id="quote">Get quote</button>
      <button class="swap" id="swap" disabled>Connect wallet to swap</button></div>
    <div class="status" id="msg"></div>
  </div>
  <div class="launches" id="launches-sec"><h2>Launches</h2><div class="grid" id="launches">Loading...</div>
    <div class="mut" style="margin-top:8px">Click a launch to pick its token in the “You receive” field.</div></div>
  <div class="partner">Partner: <img src="ammora.jpg" alt="Ammora"></div>
</main>
<script type="module" src="/src/main.js"></script>
<!-- ===== UNDERWATER WORLD ON THE SIDES ===== -->
<style>
  header, main { position: relative; z-index: 1; }
  .sea { position: fixed; top: 0; bottom: 0; width: clamp(90px, 14vw, 220px);
    pointer-events: none; overflow: hidden; z-index: 0; }
  .sea.left { left: 0; } .sea.right { right: 0; }
  /* лучи света */
  .sea::before { content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(105deg, rgba(255,255,255,.22) 0 14px, transparent 14px 46px);
    -webkit-mask-image: linear-gradient(180deg, #000, transparent 70%);
            mask-image: linear-gradient(180deg, #000, transparent 70%);
    animation: rays 8s ease-in-out infinite alternate; }
  @keyframes rays { to { opacity: .45; } }
  /* водоросли */
  .weed { position: absolute; bottom: -4px; width: 46px; height: 190px; transform-origin: 50% 100%;
    animation: sway 4s ease-in-out infinite alternate; }
  @keyframes sway { from { transform: rotate(-6deg); } to { transform: rotate(6deg); } }
  /* пузырьки */
  .bubble { position: absolute; bottom: -30px; border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fff, rgba(255,255,255,.25));
    border: 1px solid rgba(255,255,255,.7); animation: rise linear infinite; }
  @keyframes rise { to { transform: translateY(-110vh) translateX(14px); } }
  /* рыбки */
  .fish { position: absolute; width: 56px; animation: swim ease-in-out infinite alternate; }
  @keyframes swim { from { transform: translateX(0) translateY(0); }
                    to   { transform: translateX(var(--dx)) translateY(-18px); } }
  @media (max-width: 900px) { .sea { display: none; } }
</style>

<svg width="0" height="0" style="position:absolute">
  <defs>
    <g id="weedShape"><path d="M23 190 C5 150 40 120 23 80 C8 50 30 25 23 0" fill="none" stroke="#2fc9a6" stroke-width="12" stroke-linecap="round"/>
      <path d="M23 190 C40 160 10 130 30 100" fill="none" stroke="#7be3c8" stroke-width="7" stroke-linecap="round"/></g>
    <g id="fishShape"><ellipse cx="22" cy="20" rx="20" ry="13" fill="currentColor"/>
      <path d="M40 20 L58 6 L58 34 Z" fill="currentColor"/><circle cx="12" cy="16" r="3.2" fill="#fff"/><circle cx="11" cy="16" r="1.5" fill="#2a1a4e"/></g>
  </defs>
</svg>

<div class="sea left" id="seaLeft"></div>
<div class="sea right" id="seaRight"></div>

<script>
(function () {
  const rnd = (a, b) => a + Math.random() * (b - a);
  const FISH_COLORS = ["#ff8fc2", "#ffb84d", "#7645d9", "#1fc7d4"];
  function build(el, mirror) {
    // водоросли
    [8, 52, 96].forEach((x, i) => {
      el.insertAdjacentHTML("beforeend",
        `<svg class="weed" viewBox="0 0 46 190" style="left:${x}px;height:${150 + i * 25}px;animation-delay:${i * .7}s"><use href="#weedShape"/></svg>`);
    });
    // пузырьки
    for (let i = 0; i < 9; i++) {
      const s = rnd(8, 22), b = document.createElement("div");
      b.className = "bubble";
      b.style.cssText = `width:${s}px;height:${s}px;left:${rnd(5, 85)}%;animation-duration:${rnd(9, 18)}s;animation-delay:${rnd(0, 12)}s`;
      el.appendChild(b);
    }
    // рыбки
    for (let i = 0; i < 3; i++) {
      el.insertAdjacentHTML("beforeend",
        `<svg class="fish" viewBox="0 0 60 40" style="color:${FISH_COLORS[(i + (mirror ? 2 : 0)) % 4]};top:${25 + i * 22}%;left:${rnd(5, 40)}%;
          --dx:${rnd(25, 60)}px;animation-duration:${rnd(5, 9)}s;${mirror ? "" : "transform:scaleX(-1);"}"><use href="#fishShape"/></svg>`);
    }
  }
  build(document.getElementById("seaLeft"), false);
  build(document.getElementById("seaRight"), true);
})();
</script>
</body>
</html>
